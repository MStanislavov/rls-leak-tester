# SonarQube analysis of RLS Leak Tester. Read by `npm run sonar` (scripts/sonar/scan.sh) and by CI.
# The server URL and the token are never written here: they come from SONAR_HOST_URL and
# SONAR_TOKEN (the git-ignored .env.sonar locally, secrets in CI).
#
# QUAL-001: every pattern under an *.exclusions key below is listed in rules.yaml with its reason,
# and `npm run rules` compares the two in both directions.

sonar.projectKey=postgres-rls-leak-tester
sonar.projectName=RLS Leak Tester
sonar.sourceEncoding=UTF-8

# The whole repository is the source set, so that nothing is left out silently: product code,
# the governance scripts, the configuration files (next.config.ts carries the security headers),
# the workflows and the compose file. What is not analysed is named under sonar.exclusions.
sonar.sources=.
sonar.tests=.

# Tests: the unit tests beside the code and everything under tests/. The same patterns are taken
# out of the source set, because a file is either source or test, never both.
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,tests/**

# Not analysed as source: the test files above (they are analysed as tests), the Playwright
# specs, and generated output (all of it git-ignored; named here so that the analysis does not
# depend on the scanner finding git).
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,tests/**,\
  e2e/**,\
  node_modules/**,.next/**,coverage/**,playwright-report/**,test-results/**,next-env.d.ts

# Coverage comes from Vitest (`npm run test:coverage`), which instruments src/lib, the scripts
# and the root configuration files. Routes, pages and components are exercised by Playwright,
# which LCOV from Vitest cannot see; they are the only coverage exclusions, by rule.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/app/**,src/components/**
